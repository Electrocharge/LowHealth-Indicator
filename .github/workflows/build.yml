name: Build LowHealthOverlay

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Configure
        run: xmake f --plat=android --arch=arm64-v8a --ndk=${{ steps.setup-ndk.outputs.ndk-path }} -y

      - name: Build
        run: xmake -y

      - name: Package
        run: python3 scripts/package_levipack.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LowHealthOverlay-build
          path: |
            build/android/arm64-v8a/release/libLowHealthOverlay.so
            LowHealthOverlay.levipack
