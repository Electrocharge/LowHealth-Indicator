name: Build LowHealthOverlay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Show versions
        run: |
          xmake --version
          echo "NDK: $ANDROID_NDK_ROOT"

      - name: Configure
        run: |
          xmake f -p android -a arm64-v8a -m release --ndk="$ANDROID_NDK_ROOT"

      - name: Build
        run: |
          xmake -v

      - name: Package
        run: |
          python3 scripts/package_levipack.py

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: LowHealthOverlay
          path: |
            LowHealthOverlay.levipack
            build/android/arm64-v8a/release/*.so
          if-no-files-found: error
